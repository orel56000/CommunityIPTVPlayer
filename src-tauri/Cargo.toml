[package]
name = "community-iptv-player"
version = "0.6.0"
description = "Community IPTV Player desktop relay and app shell"
authors = ["Community IPTV Player contributors"]
license = "MIT"
repository = "https://github.com/orel56000/CommunityIPTVPlayer"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"

# Local HTTP relay (axum + reqwest + tokio) — see src/relay.rs
axum = "0.7"
# Use rustls (not native-tls/OpenSSL) so the relay cross-compiles to Android/iOS
# without an OpenSSL toolchain. rustls works the same on desktop.
reqwest = { version = "0.12", default-features = false, features = [
    "stream",
    "rustls-tls",
    "http2",
    "charset",
] }
tokio = { version = "1", features = ["full"] }
url = "2"
tower-http = { version = "0.5", features = ["fs", "cors", "set-header"] }
tauri-plugin-opener = "2"

# Desktop-only dependencies. The system tray, and native Google Cast (rust_cast
# pulls OpenSSL; mDNS discovery is desktop-oriented) are excluded from the
# Android/iOS builds, which have no OpenSSL toolchain and their own cast stack.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2.11.2", features = ["tray-icon"] }
rust_cast = "0.21"
mdns-sd = "0.20"
